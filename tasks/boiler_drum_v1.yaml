# boiler_drum_v1 — steam-drum level with shrink and swell, mismatch tier
#
# The pack's non-minimum-phase task. Every control action this loop can take is answered
# first by a level movement in the wrong direction, and the only trip that can actually be
# hit is on a signal nobody measures. A single-element PI is bandwidth-limited by the RHP
# zero; the reference anchor is the best one of those. Beating it means doing what the
# industry does — feeding the measured steam flow forward, so the feedwater does not wait
# for a transmitter that lies during exactly the transients that matter.
#
# IMMUTABLE ONCE PUBLISHED. Changing any value here changes what every historical score
# means. Cut boiler_drum_v2 instead.

task_id: boiler_drum_v1
tier: mismatch

description: >
  A natural-circulation drum boiler, about 50 kg/s of steam at 85 bar. Your loop is the
  feedwater valve, FCV-201, which admits ~200 degC feedwater to the drum against pump
  discharge pressure — so the same valve position passes more water when drum pressure sags,
  and drum pressure sags when you fill. Firing is on the boiler master: it is on automatic,
  it is not yours, and it lags a load change by the better part of a minute.

  LT-101 reads the level of a two-phase surface, not a water inventory. Cold feedwater
  subcools the circulating water, part of the riser tube stops boiling, the void collapses
  and the risers draw water out of the drum: the indicated level falls for a minute or so
  after you open the valve and only then rises. A load increase does the opposite — pressure
  sags before the firing catches up, the riser void expands, and the level rises while the
  drum is emptying.

  Two trips. Carryover at +250 mm on the indicated level: a two-phase surface reaching the
  separators puts water into the steam line. Low water at -250 mm on the WATER INVENTORY —
  the level the drum would read if every bubble in the system collapsed. That is the trip
  that starves and splits tubes, it is what the -250 mm limit is written against, and there
  is no transmitter on this unit that reads it. During a swell the indicated level sits well
  above the inventory, which is why trusting LT-101 through a load change is how boilers are
  lost.

  Steam flow (FT-103) and feedwater flow (FT-104) are both instrumented, as is drum pressure
  (PT-102). None of them carry setpoints.

plant:
  kind: boiler_drum
  sample_time: 5.0
  substeps: 10
  nominal_u: 45.0
  level_trip_low: -250.0
  level_trip_high: 250.0
  p_lo: 70.0
  p_hi: 100.0
  # Relative log-normal spread per scenario. The controller is told the NOMINAL parameters
  # (mismatch tier) and runs against a draw from this.
  #
  # Sized against the initial condition, as the four_tank comments insist — but the
  # conclusion is different here and it is worth saying why. This plant solves its own
  # equilibrium at reset and defines the level datum there, so EVERY draw starts settled at
  # 0 mm with 250 mm of room either way. No draw can start near a trip, so the spread is
  # sized against what it does to the DYNAMICS instead: at these values the riser void
  # store, the mixing delay that sets how fast the shrink arrives, and the bubble residence
  # time move the RHP zero over roughly a 2:1 range across the ensemble. That is a genuine
  # robustness test for a loop whose achievable bandwidth is set by that zero, and it is
  # still winnable on every draw.
  mismatch:
    A_d: 0.03          # drum area — level gain
    V_r: 0.04          # riser volume — size of the void store, i.e. of the shrink
    C_dc: 0.05         # circulation rate
    T_d: 0.10          # bubble residence under the level
    V_mix: 0.12        # how promptly feedwater reaches the downcomers: zero location
    k_fw: 0.03         # feedwater valve coefficient — loop gain
    h_fw: 0.02         # feedwater temperature — strength of the shrink
    m_t: 0.05          # metal mass — pressure inertia, and so the size of the swell
    k_turbine: 0.02    # where the unit sits on its load curve
    tau_fire: 0.10     # combustion lag — also the size of the swell

horizon: 2600.0
controlled: [0]

# A step up, a load change through it, a slow ramp, and a return. The ramp is not decoration:
# a controller detuned enough to survive the shrink can still wind up on a ramp it is too
# slow to follow, and one tuned to chase the ramp will not survive t=700.
setpoints:
  - { t: 0,    values: [0.0] }
  - { t: 300,  values: [80.0] }
  - { t: 1400, values: [-60.0], ramp: 180 }
  - { t: 2100, values: [0.0] }

# The load changes are the point of the task: shrink and swell are provoked by load, not by
# setpoints. Turbine valve 1.00 -> 1.10 is a 10% load pickup, and the drum swells about 70 mm
# while the inventory drains underneath it — the indicated level asks for less water at the
# moment the boiler most needs more. The 10% load DROP at t=1900 is the mirror image and is
# not a duplicate: pressure rises, the void collapses, the level falls, and a controller that
# believes it opens the valve into a drum that is already filling and rides up towards
# carryover.
#
# Each load excursion is taken back off after 350 s. That is a scenario-design constraint,
# not squeamishness: with a level plant that integrates flow imbalance, a load change held
# open to the horizon empties the boiler no matter who is controlling it, `rtcbench validate`
# would fail on "holding the actuators already violates", and an unwinnable scenario is noise
# in the ensemble rather than a hard task. At +/-10% for 350 s the hold anchor bottoms out
# around -175 mm of inventory against the -250 mm trip: still nothing a controller can ignore.
#
# The heater trip at t=1500 is the second upset and a different shape: feedwater enthalpy
# falls ~150 kJ/kg (about 35 degC), which deepens every shrink from then on. A controller
# that identified the plant during the first half of the run is now holding the wrong gain.
disturbances:
  - { t: 700,  params: { turbine_valve: 1.10 } }
  - { t: 1050, params: { turbine_valve: 1.00 } }
  - { t: 1500, params: { h_fw: 700.0 } }
  - { t: 1900, params: { turbine_valve: 0.90 } }
  - { t: 2250, params: { turbine_valve: 1.00 } }

instruments:
  sensors:
    # Drum level is measured across a boiling surface: it is the noisiest signal on the unit,
    # and the noise is the reason a controller cannot simply differentiate its way out of the
    # inverse response.
    noise_std: [2.0, 0.05, 0.4, 0.4]      # mm, bar, kg/s, kg/s
    deadtime_samples: 1                    # one scan of transport delay
    quantization: [0.5, 0.01, 0.05, 0.05]
    dropout_prob: 0.001
  actuators:
    rate_limit: 2.0                        # %/s — a big feedwater valve strokes in ~50 s
    deadband: 0.25                         # % of stiction

scoring:
  w_error: 1.0
  w_effort: 0.5
  cvar_alpha: 0.10
  max_total_variation: 0.00169   # ~4x the tuned reference's tv

budget:
  step_seconds: 0.05
  max_overruns: 20

# Provenance: experiments/tune_reference.py, coordinate descent over (kp, ti, beta)
# per loop. Best mean cost 0.047359 with zero gated scenarios.
# Flatness: +C:/Program Files/Git/-25% on kp costs 5.4% -- a broad basin, not a fit to the seeds.
# ti=2000s is not a typo. The drum's RHP zero (shrink/swell) caps achievable bandwidth,
# so the correct integral action is very slow. An earlier tuner whose grid stopped at 200s
# found NO safe tuning at all and reported the task as impossible.
# The reference defines 1.0 on this task, so an under-tuned one inflates every score
# here forever. If a naive PI beats it, the reference is wrong, not the naive PI.
reference:
  kind: pid
  pairing: [0]
  kp: [0.05]
  ti: [2000.0]
  beta: [1.0]

scenarios:
  seeds: [11, 23, 37, 41, 59, 67, 73, 89, 97, 103, 127, 149, 163, 179, 191, 211, 227, 239, 251, 269]
