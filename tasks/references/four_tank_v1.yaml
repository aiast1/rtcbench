# Reference anchor for four_tank_v1.
#
# Kept OUT of the task file on purpose. The task file is what a competitor is
# handed and what a filesystem-capable submission will read; an agent has
# already lifted these gains from a task file and reported them as its own
# tuning. Publishing the anchor is right -- an unarguable reference is worse
# than a weak one -- but publishing it in the competitor's line of sight is not.
#
# rtcbench.task loads this automatically; nothing needs to reference it by path.

# Provenance: experiments/tune_reference.py, coordinate descent over (kp, ti, beta)
# per loop. Best mean cost 0.005396 with zero gated scenarios.
# Flatness: +C:/Program Files/Git/-25% on kp costs 0.7% to 3.7% -- a broad basin, not a fit to the seeds.
# Tuned on ALL 20 seeds. The previous anchor (kp=2.0, ti=20) was tuned on 6 and came out 7%
# weaker on the full ensemble -- an under-tuned anchor inflates every score on its task, so it
# was retuned when the tuner's default changed.
# 
# max_total_variation is deliberately NOT retightened to 4x this reference's tv (which would be
# 0.0113). The duty gate exists to catch pathological chattering -- the worst observed was 24x
# the reference -- not to track how smooth the anchor happens to be. Tightening it here would
# gate submissions that were previously fine, changing the task's difficulty for a reason that
# has nothing to do with the anchor improving.
# The reference defines 1.0 on this task, so an under-tuned one inflates every score
# here forever. If a naive PI beats it, the reference is wrong, not the naive PI.
reference:
  kind: pid
  pairing: [0, 1]
  kp: [1.2, 1.2]
  ti: [15.0, 20.0]
  beta: [1.0, 1.0]

