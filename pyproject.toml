[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rtcbench"
version = "0.1.0"
description = "A benchmark for LLMs that commission real closed-loop control systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "RTCbench contributors" }]
keywords = ["benchmark", "control", "process-control", "llm", "pid", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

# Deliberately two dependencies, both pure-Python-friendly and universally available.
# The project's core promise is that a stranger can `pip install` and reproduce a
# leaderboard row on a laptop; every dependency added here is a way that stops being true.
# In particular there is no plotting library: see rtcbench/trend.py.
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff", "mypy"]

[project.scripts]
rtcbench = "rtcbench.cli:main"

[project.urls]
Homepage = "https://github.com/rtcbench/rtcbench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
